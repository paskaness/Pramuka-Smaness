        const DRIVE_IMAGE_URL_BASE = 'https://drive.google.com/uc?id=';
        const getDriveUrlFromLink = (url) => {
            if (!url || typeof url !== 'string') return '';
            const match = url.match(/(?:drive\.google\.com\/file\/d\/|drive\.google\.com\/open\?id=|drive\.google\.com\/uc\?id=)([a-zA-Z0-9_-]+)/);
            if (match && match[1]) return `${DRIVE_IMAGE_URL_BASE}${match[1]}`;
            return url;
        };

        const getImageUrl = (data) => {
            if (!data) return '';
            if (typeof data === 'object') {
                if (data.imageUrl) return getDriveUrlFromLink(data.imageUrl);
                if (data.image) return data.image;
            }
            if (typeof data === 'string') return data.startsWith('http') ? getDriveUrlFromLink(data) : data;
            return '';
        };

        // ===== 1. SISTEM AUTENTIKASI & PROFIL (DENGAN SHARDING 2 DATABASE AKUN) =====
        const useAuth = () => {
            const [user, setUser] = useState(null);
            const [userProfile, setUserProfile] = useState({ name: '', photo: '' });

            useEffect(() => {
                const unsubscribe = window.fbAuth.onAuthStateChanged(async (currentUser) => {
                    if (currentUser) {
                        setUser(currentUser);
                        
                        // Bersihkan pemantau lama
                        if (window.activeProfileRef) window.activeProfileRef.off();

                        // Cek profil di Database Akun 1
                        const snap1 = await window.dbAkun1.ref('users/' + currentUser.uid).once('value');
                        if (snap1.exists()) {
                            window.activeProfileRef = window.dbAkun1.ref('users/' + currentUser.uid);
                        } else {
                            // Jika tidak ada, cek di Database Akun 2
                            const snap2 = await window.dbAkun2.ref('users/' + currentUser.uid).once('value');
                            if (snap2.exists()) {
                                window.activeProfileRef = window.dbAkun2.ref('users/' + currentUser.uid);
                            } else {
                                // Default darurat
                                window.activeProfileRef = window.dbAkun1.ref('users/' + currentUser.uid);
                            }
                        }

                        // Pantau perubahan profil secara live
                        window.activeProfileRef.on('value', (snap) => {
                            if(snap.exists()) setUserProfile(snap.val());
                        });

                    } else {
                        setUser(null);
                        setUserProfile({ name: '', photo: '' });
                        if (window.activeProfileRef) window.activeProfileRef.off();
                    }
                });
                return () => unsubscribe();
            }, []);

            const login = async (email, password) => await window.fbAuth.signInWithEmailAndPassword(email, password);
            
            // LOGIKA LOGIN GOOGLE DENGAN SHARDING
            const loginWithGoogle = async () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                const res = await window.fbAuth.signInWithPopup(provider);
                const user = res.user;
                
                // Cek apakah user sudah punya data profil di database kita
                const snap1 = await window.dbAkun1.ref('users/' + user.uid).once('value');
                const snap2 = await window.dbAkun2.ref('users/' + user.uid).once('value');
                
                // Jika belum ada di kedua DB (berarti pengguna baru pertama kali login Google)
                if (!snap1.exists() && !snap2.exists()) {
                    const snapCount1 = await window.dbAkun1.ref('users').once('value');
                    const count1 = snapCount1.exists() ? Object.keys(snapCount1.val()).length : 0;
                    
                    const snapCount2 = await window.dbAkun2.ref('users').once('value');
                    const count2 = snapCount2.exists() ? Object.keys(snapCount2.val()).length : 0;
                    
                    const targetDB = count1 <= count2 ? window.dbAkun1 : window.dbAkun2;
                    
                    // Simpan nama dan foto asli dari akun Google mereka
                    await targetDB.ref('users/' + user.uid).set({ 
                        name: user.displayName || 'Anggota Google', 
                        photo: user.photoURL || '' 
                    });
                }
                return res;
            };

            const register = async (email, password, name) => {
                const res = await window.fbAuth.createUserWithEmailAndPassword(email, password);
                
                // LOGIKA SHARDING: Cek jumlah data di DB Akun 1 dan 2
                const snap1 = await window.dbAkun1.ref('users').once('value');
                const count1 = snap1.exists() ? Object.keys(snap1.val()).length : 0;
                
                const snap2 = await window.dbAkun2.ref('users').once('value');
                const count2 = snap2.exists() ? Object.keys(snap2.val()).length : 0;
                
                // Bergantian menyimpan untuk membagi beban dan ruang penyimpanan
                const targetDB = count1 <= count2 ? window.dbAkun1 : window.dbAkun2;
                await targetDB.ref('users/' + res.user.uid).set({ name: name, photo: '' });
            };
            
            const logout = () => window.fbAuth.signOut();
            
            const updateProfile = async (newName, photoBase64) => {
                if(!user) return;
                
                let targetDB = window.dbAkun1;
                try {
                    const snap1 = await window.dbAkun1.ref('users/' + user.uid).once('value');
                    if (!snap1.exists()) {
                        const snap2 = await window.dbAkun2.ref('users/' + user.uid).once('value');
                        if (snap2.exists()) targetDB = window.dbAkun2;
                    }
                    
                    // Mendorong data ke database
                    await targetDB.ref('users/' + user.uid).update({ name: newName, photo: photoBase64 });
                    // Sinkronisasi paksa ke UI tanpa menunggu internet
                    setUserProfile(prev => ({...prev, name: newName, photo: photoBase64}));
                } catch (error) {
                    throw new Error("Gagal menyimpan ke Database. Pastikan Rules Firebase true.");
                }
            };

            return { user, userProfile, login, register, logout, updateProfile, loginWithGoogle };
        };

        // ===== 2. SISTEM LIKE & KOMENTAR (DI DATABASE UTAMA) =====
        const useLikes = (auth) => {
            const [userLikes, setUserLikes] = useState(new Set());
            const [totalLikes, setTotalLikes] = useState({});

            // Mengambil Total Likes setiap postingan
            useEffect(() => {
                if (window.dbLikeKomen) {
                    const likesRef = window.dbLikeKomen.ref('likes');
                    likesRef.on('value', (snapshot) => {
                        if (snapshot.exists()) {
                            setTotalLikes(snapshot.val()); // Langsung menggunakan object angka { "1": 15, "2": 0 }
                        } else {
                            setTotalLikes({});
                        }
                    });
                    return () => likesRef.off();
                }
            }, []);

            // Mengambil status Like khusus user yang sedang login
            useEffect(() => {
                if (auth && auth.user && window.dbLikeKomen) {
                    const userLikesRef = window.dbLikeKomen.ref(`user_likes/${auth.user.uid}`);
                    userLikesRef.on('value', (snapshot) => {
                        if (snapshot.exists()) {
                            setUserLikes(new Set(Object.keys(snapshot.val()).filter(k => snapshot.val()[k])));
                        } else {
                            setUserLikes(new Set());
                        }
                    });
                    return () => userLikesRef.off();
                } else {
                    setUserLikes(new Set()); // Reset jika tidak login
                }
            }, [auth?.user]);

            const handleLike = useCallback(async (activityId, e) => {
                if(e) e.stopPropagation();
                
                if (!auth || !auth.user) {
                    alert("Silakan Login terlebih dahulu untuk memberikan Like!");
                    window.dispatchEvent(new CustomEvent('openAuthModal'));
                    return;
                }

                const strActivityId = String(activityId);
                const isLiking = !userLikes.has(strActivityId);

                // Update UI cepat (Optimistic Update)
                const newUserLikes = new Set(userLikes);
                if (isLiking) newUserLikes.add(strActivityId);
                else newUserLikes.delete(strActivityId);
                setUserLikes(newUserLikes);

                if (window.dbLikeKomen) {
                    const postRef = window.dbLikeKomen.ref('likes/' + strActivityId);
                    const userLikeRef = window.dbLikeKomen.ref(`user_likes/${auth.user.uid}/${strActivityId}`);
                    
                    try {
                        if (isLiking) {
                            await userLikeRef.set(1); // 1 lebih ringkas dari true
                        } else {
                            await userLikeRef.remove();
                        }

                        // Menggunakan increment pada node angka langsung agar super efisien
                        await postRef.set(firebase.database.ServerValue.increment(isLiking ? 1 : -1));
                    } catch (err) {
                        console.error("Firebase Like Error: ", err);
                        alert("Gagal menyimpan Like ke Database.\n\nPastikan Rules Firebase Realtime Database diset ke true untuk .read dan .write\n\nDetail Error: " + err.message);
                        setUserLikes(new Set(userLikes)); // Kembalikan state visual jika gagal
                    }
                }
            }, [auth, userLikes]);

            const hasUserLiked = useCallback((activityId) => userLikes.has(String(activityId)), [userLikes]);
            const getTotalLikes = useCallback((activityId) => totalLikes[String(activityId)] || 0, [totalLikes]);

            return { handleLike, hasUserLiked, getTotalLikes };
        };

        const CommentsSection = ({ activityId, auth }) => {
            const [comments, setComments] = useState([]);
            const [text, setText] = useState('');
            const [userProfilesCache, setUserProfilesCache] = useState({});
            const [activeCommentMenu, setActiveCommentMenu] = useState(null);
            const fetchingUids = useRef(new Set());
            const longPressTimer = useRef(null);

            useEffect(() => {
                if (!activityId || !window.dbLikeKomen) return;
                const commentsRef = window.dbLikeKomen.ref(`comments/${activityId}`);
                
                commentsRef.on('value', (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        const commentsArray = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                        commentsArray.sort((a, b) => b.timestamp - a.timestamp);
                        setComments(commentsArray);

                        // Muat profil untuk setiap uid komentar yang belum ada di cache
                        const uniqueUids = [...new Set(commentsArray.map(c => c.uid))].filter(Boolean);
                        uniqueUids.forEach(async (uid) => {
                            if (!fetchingUids.current.has(uid)) {
                                fetchingUids.current.add(uid);
                                
                                let profileData = null;
                                const snap1 = await window.dbAkun1.ref('users/' + uid).once('value');
                                if (snap1.exists()) {
                                    profileData = snap1.val();
                                } else {
                                    const snap2 = await window.dbAkun2.ref('users/' + uid).once('value');
                                    if (snap2.exists()) {
                                        profileData = snap2.val();
                                    }
                                }
                                
                                if (profileData) {
                                    setUserProfilesCache(prev => ({ ...prev, [uid]: profileData }));
                                }
                            }
                        });

                    } else {
                        setComments([]);
                    }
                });
                return () => commentsRef.off();
            }, [activityId]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                
                // Mencegah Komentar jika belum Login
                if (!auth.user) {
                    alert("Anda harus Login terlebih dahulu untuk mengirim komentar!");
                    return window.dispatchEvent(new CustomEvent('openAuthModal'));
                }
                
                if (!text.trim() || !window.dbLikeKomen) return;
                
                try {
                    const commentsRef = window.dbLikeKomen.ref(`comments/${activityId}`);
                    await commentsRef.push({
                        uid: auth.user.uid,
                        text: text.trim(),
                        timestamp: Date.now()
                    });
                    setText('');
                } catch (err) {
                    console.error("Gagal kirim komentar", err);
                }
            };

            const handlePressStart = (comment) => {
                // Hanya boleh menahan komentar sendiri
                if (!auth.user || auth.user.uid !== comment.uid) return;
                
                longPressTimer.current = setTimeout(() => {
                    setActiveCommentMenu(comment.id);
                    // Beri efek getar sedikit pada HP jika didukung
                    if (window.navigator && window.navigator.vibrate) {
                        window.navigator.vibrate(50);
                    }
                }, 2000); // 2 detik sesuai permintaan
            };

            const handlePressEnd = () => {
                if (longPressTimer.current) {
                    clearTimeout(longPressTimer.current);

                                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>

        // --- OBAT PENAWAR BLANK SCREEN (Kompabilitas Lucide + React) ---
        const Icon = ({ name, className }) => {
            const spanRef = useRef(null);
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className || ''}"></i>`;
                    window.lucide.createIcons({ root: spanRef.current });
                }
            }, [name, className]);
            return <span ref={spanRef} style={{ display: 'contents' }}></span>;
        };

        const Background3DObjects = React.memo(({ animationLevel = 50 }) => {
            const requestRef = useRef();
            const rotationRef = useRef(0);

            useEffect(() => {
                let lastScrollY = window.scrollY;
                let ticking = false;

                const updateScroll = () => {
                    document.documentElement.style.setProperty('--scroll-y', lastScrollY);
                    rotationRef.current += 1.2;
                    ticking = false;
                };

                const handleScroll = () => { 
                    lastScrollY = window.scrollY;
                    if (!ticking) {
                        window.requestAnimationFrame(updateScroll);
                        ticking = true;
                    }
                };
                
                window.addEventListener('scroll', handleScroll, { passive: true });
                document.documentElement.style.setProperty('--scroll-y', window.scrollY);
                
                let lastTime = 0;
                const fpsInterval = 1000 / 30; // Batasi animasi 30 FPS agar ringan
                
                const animate = (time) => { 
                    if (animationLevel === 0) return;
                    requestRef.current = requestAnimationFrame(animate); 
                    
                    const elapsed = time - lastTime;
                    if (elapsed > fpsInterval) {
                        lastTime = time - (elapsed % fpsInterval);
                        rotationRef.current += 0.25; 
                        document.documentElement.style.setProperty('--global-rot', `${rotationRef.current}deg`); 
                    }
                };
                if (animationLevel > 0) requestRef.current = requestAnimationFrame(animate);
                
                return () => { window.removeEventListener('scroll', handleScroll); if (requestRef.current) cancelAnimationFrame(requestRef.current); };
            }, [animationLevel]);

            const blobs = useMemo(() => {
                if (animationLevel === 0) return [];
                const baseCount = window.innerWidth < 768 ? 6 : 14;
                const count = Math.ceil(baseCount * (animationLevel / 100));
                return Array.from({ length: count }).map((_, i) => ({ id: i, left: `${Math.random() * 100}vw`, top: `${Math.random() * 100}%`, width: `${Math.random() * 300 + 100}px`, height: `${Math.random() * 300 + 100}px`, animDuration: `${Math.random() * 15 + 10}s`, animDelay: `${Math.random() * -20}s`, color: ['#7dd3fc', '#c8a0f0', '#38bdf8', '#a855f7', '#60a5fa'][Math.floor(Math.random() * 5)] }));
            }, [animationLevel]);
            
            const shapesData = useMemo(() => { 
                if (animationLevel === 0) return [];
                const shapes = []; 
                const baseCount = window.innerWidth < 768 ? 20 : 60; 
                const count = Math.ceil(baseCount * (animationLevel / 100));
                for (let i = 0; i < count; i++) { shapes.push({ id: i, type: Math.random() > 0.5 ? 'cube' : 'diamond', size: Math.random() * 40 + 30, left: `${Math.random() * 90 + 5}%`, top: `${(i * (100/count)) + (Math.random() * 10)}%`, color: ['var(--theme-primary)', 'var(--theme-tertiary)', '#38bdf8', '#a855f7', '#60a5fa'][Math.floor(Math.random() * 5)], rotX: (Math.random() - 0.5) * 3, rotY: (Math.random() - 0.5) * 3, parallaxSpeed: Math.random() * 0.5 + 0.2 }); } return shapes; 
            }, [animationLevel]);

            const Shape3D = React.memo(({ type, size, left, top, color, rotX, rotY, parallaxSpeed }) => (
                <div className="absolute pointer-events-none z-[-1]" style={{ left, top }}>
                    <div style={{ transform: `translateY(calc(var(--scroll-y) * ${parallaxSpeed} * 1px))` }}>
                        <div className="shape-container" style={{ width: size, height: size, perspective: '1000px', '--rot-speed-x': rotX, '--rot-speed-y': rotY, color }}>
                            {type === 'cube' && ( <div className="shape-wrapper w-full h-full relative"> <div className="cube-face" style={{ transform: `translateZ(${size/2}px)` }}></div> <div className="cube-face" style={{ transform: `rotateY(180deg) translateZ(${size/2}px)` }}></div> <div className="cube-face" style={{ transform: `rotateY(90deg) translateZ(${size/2}px)` }}></div> <div className="cube-face" style={{ transform: `rotateY(-90deg) translateZ(${size/2}px)` }}></div> <div className="cube-face" style={{ transform: `rotateX(90deg) translateZ(${size/2}px)` }}></div> <div className="cube-face" style={{ transform: `rotateX(-90deg) translateZ(${size/2}px)` }}></div> </div> )}
                            {type === 'diamond' && ( <div className="shape-wrapper w-full h-full relative" style={{ transform: 'rotateZ(45deg) rotateX(calc(var(--global-rot) * var(--rot-speed-x))) rotateY(calc(var(--global-rot) * var(--rot-speed-y)))' }}> <div className="cube-face" style={{ transform: `translateZ(${size/2}px)` }}></div> <div className="cube-face" style={{ transform: `rotateY(180deg) translateZ(${size/2}px)` }}></div> <div className="cube-face" style={{ transform: `rotateY(90deg) translateZ(${size/2}px)` }}></div> <div className="cube-face" style={{ transform: `rotateY(-90deg) translateZ(${size/2}px)` }}></div> <div className="cube-face" style={{ transform: `rotateX(90deg) translateZ(${size/2}px)` }}></div> <div className="cube-face" style={{ transform: `rotateX(-90deg) translateZ(${size/2}px)` }}></div> </div> )}
                        </div>
                    </div>
                </div>
            ));

            if (animationLevel === 0) return null;

            return (
                <>
                    <div className="fixed inset-0 overflow-hidden pointer-events-none z-[-2]"> {blobs.map(b => ( <div key={`blob-${b.id}`} className="absolute rounded-full opacity-20 dark:opacity-30 mix-blend-screen filter blur-[80px] animate-blob" style={{ left: b.left, top: b.top, width: b.width, height: b.height, background: b.color, animationDuration: b.animDuration, animationDelay: b.animDelay }} /> ))} </div>
                    <div className="absolute inset-0 pointer-events-none z-[-1] overflow-hidden" style={{ minHeight: '100vh' }}> {shapesData.map(shape => <Shape3D key={shape.id} {...shape} />)} </div>
                </>
            );
        });

        const RealTimeClock = () => {
            const [time, setTime] = useState(new Date());
            
            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const fullString = time.toLocaleString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/\./g, ':');
            const shortString = time.toLocaleString('id-ID', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/\./g, ':');

            return (
                <div className="flex items-center gap-1.5 md:gap-2 text-[10px] md:text-xs font-bold text-on-surface-variant bg-black/10 dark:bg-white/5 px-2.5 py-1.5 rounded-full border border-white/5 whitespace-nowrap ml-1 md:ml-2 shadow-inner">
                    <Icon name="clock" className="w-3 h-3 md:w-3.5 md:h-3.5 text-primary" />
                    <span className="hidden xl:inline">{fullString}</span>
                    <span className="xl:hidden">{shortString}</span>
                </div>
            );
        };

        const Navbar = ({ activeTab, setActiveTab, isLightMode, toggleTheme, auth }) => {
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [isSearchOpen, setIsSearchOpen] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const searchInputRef = useRef(null);

            // Fokus pada input ketika kolom pencarian dibuka
            useEffect(() => {
                if (isSearchOpen && searchInputRef.current) {
                    searchInputRef.current.focus();
                }
            }, [isSearchOpen]);

            // Logika Pencarian Global (Context-Aware)
            const searchResults = useMemo(() => {
                if (!searchQuery.trim()) return [];
                const query = searchQuery.toLowerCase();
                
                if (activeTab === 'structure') {
                    // Pencarian struktur melalui dropdown, diurutkan berdasarkan kemiripan (scoring)
                    return MEMBERS
                        .map(m => {
                            let score = 0;
                            const name = (m.name || '').toLowerCase();
                            const role = (m.role || '').toLowerCase();
                            const period = (m.period || '').toLowerCase();
                            
                            // Exact Match
                            if (name === query) score += 1000;
                            if (role === query) score += 900;
                            
                            // Starts With Match
                            if (name.startsWith(query)) score += 500;
                            if (role.startsWith(query)) score += 400;
                            
                            // Includes Match (semakin awal posisinya, semakin tinggi nilainya)
                            const nameIdx = name.indexOf(query);
                            const roleIdx = role.indexOf(query);
                            
                            if (nameIdx > 0) score += (100 - nameIdx);
                            if (roleIdx > 0) score += (80 - roleIdx);
                            
                            // Jika ada kecocokan di periode
                            if (period.includes(query)) score += 10;

                            return { ...m, score };
                        })
                        .filter(m => m.score > 0)
                        .sort((a, b) => b.score - a.score)
                        .slice(0, 10); // Batasi 10 hasil yang paling mirip agar tidak penuh
                }
                
                // Jika di halaman lain, gabungkan kegiatan terkini dan koleksi masa lalu
                const allActivities = [...ACTIVITIES, ...PAST_COLLECTIONS].filter((item, index, self) =>
                    index === self.findIndex((t) => t.id === item.id)
                );
                
                return allActivities.filter(item => 
                    item.title.toLowerCase().includes(query) || 
                    item.description.toLowerCase().includes(query) ||
                    (item.category && item.category.toLowerCase().includes(query)) ||
                    (item.location && item.location.toLowerCase().includes(query)) ||
                    (item.status && item.status.toLowerCase().includes(query))
                ).slice(0, 6); // Ambil maksimal 6 hasil pencarian
            }, [searchQuery, activeTab]);

            const closeSearch = () => {
                setIsSearchOpen(false);
                setSearchQuery('');
            };

            return (
                <nav className="fixed top-0 w-full z-50 bg-[var(--theme-nav)] backdrop-blur-lg border-b border-sky-400/10 transition-colors duration-300">
                    <div className="flex justify-between items-center px-4 md:px-8 py-4 max-w-7xl mx-auto">
                        
                        {/* BAGIAN KIRI: Hamburger & Tombol Profil Berdampingan */}

        const StandaloneCarousel = ({ items, onNavigate, handleLike, hasUserLiked, getTotalLikes, autoPlayDelay = 5000 }) => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isHovered, setIsHovered] = useState(false);
            const touchStartX = useRef(0);

            useEffect(() => {
                if (isHovered || items.length <= 1) return;
                const timer = setInterval(() => {
                    setCurrentIndex((prev) => (prev + 1) % items.length);
                }, autoPlayDelay);
                return () => clearInterval(timer);
            }, [isHovered, items.length, autoPlayDelay]);

            const handleTouchStart = (e) => { touchStartX.current = e.changedTouches[0].screenX; };
            const handleTouchEnd = (e) => {
                if (items.length <= 1) return;
                const touchEndX = e.changedTouches[0].screenX;
                if (touchEndX < touchStartX.current - 40) setCurrentIndex(prev => (prev + 1) % items.length);

                    <header className="text-center mb-16 relative z-10"> <h1 className="text-5xl md:text-6xl font-extrabold text-on-surface tracking-tight mb-6"> {WEBSITE_CONTENT.structure.title.split(' ')[0]} <span className="text-primary">{WEBSITE_CONTENT.structure.title.split(' ')[1]}</span> </h1> <p className="text-on-surface-variant max-w-2xl mx-auto text-lg">{WEBSITE_CONTENT.structure.subtitle}</p> </header>
                    <div className="flex flex-col items-center mb-20 relative z-10"> <div className="glass-panel p-1.5 rounded-full flex gap-1 inline-flex overflow-x-auto max-w-full"> {AVAILABLE_PERIODS.map((period) => ( <button key={period} onClick={() => setActivePeriod(period)} className={`px-8 py-3 rounded-full text-sm font-bold transition-all duration-300 whitespace-nowrap ${activePeriod === period ? "bg-primary/15 border border-primary/40 text-primary shadow-[0_0_20px_rgba(125,211,252,0.1)]" : "text-on-surface-variant hover:text-primary hover:bg-black/5 dark:hover:bg-white/5"}`}> Periode {period} </button> ))} </div> </div>
                    {filteredMembers.length === 0 ? (
                        <div className="glass-panel p-12 rounded-3xl text-center w-full relative z-10"> <Icon name="users" className="w-16 h-16 text-on-surface-variant mx-auto mb-4 opacity-20" /> <p className="text-on-surface-variant text-xl">{WEBSITE_CONTENT.structure.noData}</p> </div>
                    ) : (
                        <>
                            {grouped.ketua && (
                                <div className="mb-24 relative z-10"> <h3 className="text-2xl font-bold text-on-surface mb-10 flex items-center gap-3"><span className="w-12 h-[2px] bg-primary"></span>{WEBSITE_CONTENT.structure.categories.pimpinan}</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
                                        <div className="md:col-span-8 glass-panel rounded-3xl p-8 flex flex-col md:flex-row items-center gap-8 group hover:shadow-[0_0_30px_rgba(125,211,252,0.15)] transition-all duration-500"> <div className="overflow-hidden rounded-2xl"> <img src={getImageUrl(grouped.ketua)} className="w-48 h-48 md:w-64 md:h-64 object-cover border-2 border-primary/20 group-hover:scale-110 transition-transform duration-700" referrerPolicy="no-referrer" /> </div> <div className="text-center md:text-left flex-1"> <span className="inline-block px-4 py-1 rounded-full bg-primary/10 text-primary text-sm font-semibold mb-4 tracking-widest uppercase">Ketua</span> <h2 className="text-4xl font-bold text-on-surface mb-3 tracking-tight">{grouped.ketua.name}</h2> <p className="text-on-surface-variant text-lg leading-relaxed mb-6 italic">"{grouped.ketua.quote || 'Membangun masa depan bersama.'}"</p> <div className="flex justify-center md:justify-start gap-4"> <Icon name="link" className="text-primary cursor-pointer hover:scale-125 transition-transform" /> <Icon name="mail" className="text-primary cursor-pointer hover:scale-125 transition-transform" /> </div> </div> </div>
                                        {grouped.wakil && ( <div className="md:col-span-4 glass-panel rounded-3xl p-8 flex flex-col items-center justify-center text-center group hover:shadow-[0_0_30px_rgba(168,85,247,0.15)] transition-all duration-500"> <div className="overflow-hidden rounded-full mb-6"> <img src={getImageUrl(grouped.wakil)} className="w-40 h-40 object-cover border-2 border-purple-500/20 group-hover:scale-110 transition-transform duration-700" referrerPolicy="no-referrer" /> </div> <span className="px-3 py-1 rounded-full bg-purple-500/10 text-tertiary text-xs font-bold mb-3 tracking-widest uppercase">Wakil Ketua</span> <h3 className="text-2xl font-bold text-on-surface">{grouped.wakil.name}</h3> <p className="text-on-surface-variant text-lg leading-relaxed mb-6 italic">"{grouped.wakil.quote || 'Membangun masa depan bersama.'}"</p> </div> )}
                                    </div>
                                </div>
                            )}
                            <RoleSection title={WEBSITE_CONTENT.structure.categories.pemangkuAdat} members={grouped.pemangkuAdat} colorClass="text-primary" />
                            <RoleSection title={WEBSITE_CONTENT.structure.categories.sekretariat} members={grouped.sekretariat} colorClass="text-primary" />
                            <RoleSection title={WEBSITE_CONTENT.structure.categories.juang} members={grouped.juang} colorClass="text-tertiary" />
                            <RoleSection title={WEBSITE_CONTENT.structure.categories.litev} members={grouped.litev} colorClass="text-primary" />
                            <RoleSection title={WEBSITE_CONTENT.structure.categories.litbang} members={grouped.litbang} colorClass="text-primary" />
                            <RoleSection title={WEBSITE_CONTENT.structure.categories.tekpram} members={grouped.tekpram} colorClass="text-primary" />
                            <RoleSection title={WEBSITE_CONTENT.structure.categories.pemateri} members={grouped.pemateri} colorClass="text-primary" />
                            {grouped.departemen.length > 0 && ( <div className="mb-24 relative z-10"> <h3 className="text-2xl font-bold text-on-surface mb-10 flex items-center gap-3"><span className="w-12 h-[2px] bg-primary"></span>{WEBSITE_CONTENT.structure.categories.departemen}</h3> <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"> {grouped.departemen.map(member => <MemberCard key={member.id} member={member} colorClass={member.role.includes('Bakat') ? "text-tertiary" : "text-primary"} />)} </div> </div> )}
                        </>
                    )}
                </div>
            );
        };

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [selectedActivity, setSelectedActivity] = useState(null);
            const [isLightMode, setIsLightMode] = useState(() => localStorage.getItem('paskanessTheme') === 'light');
            const [showAuthModal, setShowAuthModal] = useState(false);
            
            // Pengaturan performa render animasi 3D (default 50%)
            const [animationLevel, setAnimationLevel] = useState(() => {
                const saved = localStorage.getItem('paskanessAnimationLevel');
                return saved !== null ? parseInt(saved, 10) : 50;
            });
            
            // Mengambil fungsi auth (Login & Database Bergilir)
            const auth = useAuth();

            const handleNavigate = (tab, activity = null) => {
                setActiveTab(tab);
                if (activity !== undefined) {
                    setSelectedActivity(activity);
                }
            };

            useEffect(() => {
                const listener = () => setShowAuthModal(true);
                window.addEventListener('openAuthModal', listener);
                return () => window.removeEventListener('openAuthModal', listener);
            }, []);

            useEffect(() => {
                if (isLightMode) { document.documentElement.classList.add('light-mode'); localStorage.setItem('paskanessTheme', 'light'); } 
                else { document.documentElement.classList.remove('light-mode'); localStorage.setItem('paskanessTheme', 'dark'); }
            }, [isLightMode]);

            useEffect(() => {
                localStorage.setItem('paskanessAnimationLevel', animationLevel);
            }, [animationLevel]);

            const toggleTheme = () => setIsLightMode(!isLightMode);
            useEffect(() => { document.title = `${WEBSITE_CONFIG.brandName} - Jejak Karya & Arsip`; }, []);
            useEffect(() => { window.scrollTo(0, 0); if (window.lucide) window.lucide.createIcons(); }, [activeTab]);

            return (
                <div className="min-h-screen flex flex-col relative z-0">
                    {activeTab !== 'activity' && activeTab !== 'account' && <Background3DObjects animationLevel={animationLevel} />}
                    
                    {/* Mengirimkan data profil pengguna ke Navbar agar muncul di pojok kiri atas */}
                    <Navbar activeTab={activeTab} setActiveTab={handleNavigate} isLightMode={isLightMode} toggleTheme={toggleTheme} auth={auth} />
                    
                    <main className="flex-grow">
                        {/* Mengirimkan Auth ke halaman-halaman yang butuh fitur Komentar (Modal) */}
                        {activeTab === 'home' && <HomePage onNavigate={handleNavigate} auth={auth} />}
                        {activeTab === 'archive' && <ArchivePage onNavigate={handleNavigate} auth={auth} />}
                        {activeTab === 'structure' && <StructurePage />}
                        {activeTab === 'account' && <AccountPage auth={auth} onNavigate={handleNavigate} animationLevel={animationLevel} setAnimationLevel={setAnimationLevel} />}
                        {activeTab === 'activity' && <ActivityPage activity={selectedActivity} onBack={() => handleNavigate('archive')} onNavigate={handleNavigate} auth={auth} />}
                    </main>
                    <Footer />

                    {/* Memanggil Popup Login/Profil jika tombol ditekan */}
                    {showAuthModal && <AuthProfileModal auth={auth} onClose={() => setShowAuthModal(false)} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
