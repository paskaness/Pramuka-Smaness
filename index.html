        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // ===== KOMPONEN OPTIMASI: LAZY RENDER (INTERSECTION OBSERVER) =====
        // Komponen ini memastikan isi di dalamnya HANYA dirender jika pengguna menggulir (scroll) layar ke dekatnya
        const LazyShow = ({ children, minHeight = "100px" }) => {
            const [isVisible, setIsVisible] = useState(false);
            const domRef = useRef();

            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    if (entries[0].isIntersecting) {
                        setIsVisible(true);
                        observer.disconnect(); // Sekali muncul, biarkan tetap ada
                    }
                }, { rootMargin: "300px" }); // Mulai render saat jaraknya 300px dari pandangan mata

                if (domRef.current) observer.observe(domRef.current);
                return () => observer.disconnect();
            }, []);

            return (
                <div ref={domRef} style={{ minHeight: isVisible ? 'auto' : minHeight }} className={`transition-opacity duration-700 ${isVisible ? 'opacity-100' : 'opacity-0'}`}>
                    {isVisible ? children : null}
                </div>
            );
        };

        const getDriveUrlFromLink = (url) => {
            if (!url || typeof url !== 'string') return '';
            const match = url.match(/(?:drive\.google\.com\/file\/d\/|drive\.google\.com\/open\?id=|drive\.google\.com\/uc\?id=)([a-zA-Z0-9_-]+)/);
            if (match && match[1]) return `${DRIVE_IMAGE_URL_BASE}${match[1]}`;
            return url;
        };

        const getImageUrl = (data) => {
            if (!data) return '';
            if (typeof data === 'object') {
                if (data.imageUrl) return getDriveUrlFromLink(data.imageUrl);

            }
            if (typeof data === 'string') return data.startsWith('http') ? getDriveUrlFromLink(data) : data;
            return '';
        };

        const useAuth = () => {
            const [user, setUser] = useState(null);
            const [userProfile, setUserProfile] = useState({ name: '', photo: '' });

            useEffect(() => {
                const unsubscribe = window.fbAuth.onAuthStateChanged(async (currentUser) => {
                    if (currentUser) {
                        setUser(currentUser);
                        
                        if (window.activeProfileRef) window.activeProfileRef.off();

                        const snap1 = await window.dbAkun1.ref('users/' + currentUser.uid).once('value');
                        if (snap1.exists()) {
                            window.activeProfileRef = window.dbAkun1.ref('users/' + currentUser.uid);
                        } else {
                            const snap2 = await window.dbAkun2.ref('users/' + currentUser.uid).once('value');
                            if (snap2.exists()) {
                                window.activeProfileRef = window.dbAkun2.ref('users/' + currentUser.uid);
                            } else {
                                window.activeProfileRef = window.dbAkun1.ref('users/' + currentUser.uid);
                            }
                        }

                        window.activeProfileRef.on('value', (snap) => {
                            if(snap.exists()) setUserProfile(snap.val());
                        });

                    } else {
                        setUser(null);
                        setUserProfile({ name: '', photo: '' });
                        if (window.activeProfileRef) window.activeProfileRef.off();
                    }
                });
                return () => unsubscribe();
            }, []);

            const login = async (email, password) => await window.fbAuth.signInWithEmailAndPassword(email, password);
            
            const loginWithGoogle = async () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                const res = await window.fbAuth.signInWithPopup(provider);
                const user = res.user;
                
                const snap1 = await window.dbAkun1.ref('users/' + user.uid).once('value');
                const snap2 = await window.dbAkun2.ref('users/' + user.uid).once('value');
                
                if (!snap1.exists() && !snap2.exists()) {
                    const snapCount = await window.dbAkun1.ref('users').once('value');
                    const count = snapCount.exists() ? Object.keys(snapCount.val()).length : 0;
                    const targetDB = count < window.LIMIT_AKUN ? window.dbAkun1 : window.dbAkun2;
                    
                    await targetDB.ref('users/' + user.uid).set({ 
                        name: user.displayName || 'Anggota Google', 
                        photo: user.photoURL || '' 
                    });
                }
                return res;
            };

            const register = async (email, password, name) => {
                const res = await window.fbAuth.createUserWithEmailAndPassword(email, password);
                
                const snap = await window.dbAkun1.ref('users').once('value');
                const count = snap.exists() ? Object.keys(snap.val()).length : 0;
                
                const targetDB = count < window.LIMIT_AKUN ? window.dbAkun1 : window.dbAkun2;
                await targetDB.ref('users/' + res.user.uid).set({ name: name, photo: '' });
            };
            
            const logout = () => window.fbAuth.signOut();
            
            const updateProfile = async (newName, photoBase64) => {
                if(!user) return;
                
                let targetDB = window.dbAkun1;
                try {
                    const snap1 = await window.dbAkun1.ref('users/' + user.uid).once('value');
                    if (!snap1.exists()) {
                        const snap2 = await window.dbAkun2.ref('users/' + user.uid).once('value');
                        if (snap2.exists()) targetDB = window.dbAkun2;
                    }
                    
                    await targetDB.ref('users/' + user.uid).update({ name: newName, photo: photoBase64 });
                    setUserProfile(prev => ({...prev, name: newName, photo: photoBase64}));
                } catch (error) {
                    throw new Error("Gagal menyimpan ke Database. Pastikan Rules Firebase true.");
                }
            };

            return { user, userProfile, login, register, logout, updateProfile, loginWithGoogle };
        };

        // ===== 2. SISTEM LIKE & KOMENTAR (DI DATABASE UTAMA) =====
        const useLikes = () => {
            const [userLikes, setUserLikes] = useState(() => {
                const saved = localStorage.getItem('paskanessUserLikes');
                return saved ? new Set(JSON.parse(saved)) : new Set();
            });
            const [totalLikes, setTotalLikes] = useState({});

            useEffect(() => {
                if (window.dbLikeKomen) {
                    const likesRef = window.dbLikeKomen.ref('likes');
                    likesRef.on('value', (snapshot) => {
                        if (snapshot.exists()) {
                            const data = snapshot.val();
                            const newTotals = {};
                            for (const key in data) {
                                const postId = key.replace('post_', '');
                                newTotals[postId] = data[key].jumlahLike || 0;
                            }
                            setTotalLikes(newTotals);
                        } else {
                            setTotalLikes({});
                        }
                    });
                    return () => likesRef.off();
                }
            }, []);

            const handleLike = useCallback(async (activityId, e) => {
                if(e) e.stopPropagation();
                
                const newUserLikes = new Set(userLikes);
                let isLiking = false;

                if (newUserLikes.has(activityId)) {
                    newUserLikes.delete(activityId);
                    isLiking = false;
                } else {
                    newUserLikes.add(activityId);
                    isLiking = true;
                }

                setUserLikes(newUserLikes);
                localStorage.setItem('paskanessUserLikes', JSON.stringify(Array.from(newUserLikes)));

                if (window.dbLikeKomen) {
                    const postRef = window.dbLikeKomen.ref('likes/post_' + activityId);
                    try {
                        const snap = await postRef.once('value');
                        if (snap.exists()) {
                            const currentLikes = snap.val().jumlahLike || 0;
                            const newLikeCount = isLiking ? currentLikes + 1 : Math.max(0, currentLikes - 1);
                            await postRef.update({ jumlahLike: newLikeCount });
                        } else if (isLiking) {
                            await postRef.set({ jumlahLike: 1 });
                        }
                    } catch (err) {
                        console.error("Firebase Like Error: ", err);
                    }
                }
            }, [userLikes]);

            const hasUserLiked = useCallback((activityId) => userLikes.has(activityId), [userLikes]);
            const getTotalLikes = useCallback((activityId) => totalLikes[activityId] || 0, [totalLikes]);

            return { handleLike, hasUserLiked, getTotalLikes };
        };

                    <section className="relative flex flex-col items-center justify-center px-6 z-10 perspective-1000"> <div className="relative z-20 max-w-5xl mx-auto text-center w-full" style={{ marginTop: 'calc(-1 * min(35vw, 150px))' }}> <div className="mb-10 flex justify-center relative perspective-1000"> <div className="logo-frame logo-3d-float glass-panel-elevated relative z-30 bg-background/80 backdrop-blur-2xl"> {WEBSITE_CONFIG.imageUrl || WEBSITE_CONFIG.logoImage ? ( <img src={WEBSITE_CONFIG.imageUrl || WEBSITE_CONFIG.logoImage} alt={`${WEBSITE_CONFIG.brandName} Logo`} className="logo-image bg-transparent" loading="lazy" /> ) : ( <Icon name="image" className="logo-icon-fallback text-primary bg-transparent" /> )} </div> </div> <h1 className="text-5xl md:text-7xl font-extrabold mb-6 tracking-tight text-on-surface"> {WEBSITE_CONTENT.home.heroTitle} <br/> <span className="text-gradient animate-pop-10s">{WEBSITE_CONFIG.brandName}</span> </h1> <p className="text-xl md:text-2xl text-on-surface-variant max-w-3xl mx-auto leading-relaxed mb-12"> {WEBSITE_CONTENT.home.heroSubtitle} </p> <div className="flex flex-col sm:flex-row gap-4 justify-center"> <button type="button" onClick={() => onNavigate('archive')} className="px-10 py-4 bg-primary text-white font-bold rounded-2xl shadow-lg shadow-primary/20 hover:brightness-110 transition-all active:scale-95 text-lg"> Lihat Arsip Kegiatan </button> <button type="button" className="px-10 py-4 glass-panel text-primary font-bold rounded-2xl hover:bg-primary/10 transition-all active:scale-95 text-lg"> Pelajari Visi Kami </button> </div> </div> </section>
                    <section className="max-w-7xl mx-auto px-8 py-32 mt-10 relative z-10"> <div className="grid grid-cols-1 md:grid-cols-3 gap-8"> <div className="md:col-span-2 glass-panel p-12 rounded-3xl relative overflow-hidden group hover:shadow-[0_20px_40px_rgba(125,211,252,0.1)] transition-all duration-500"> <div className="absolute top-0 right-0 p-8 text-primary/5 group-hover:text-primary/10 transition-colors duration-500"> <Icon name="eye" className="w-40 h-40 transform group-hover:scale-110 group-hover:rotate-12 transition-transform duration-700" /> </div> <h2 className="text-4xl font-bold text-primary mb-6">{WEBSITE_CONTENT.home.visionTitle}</h2> <p className="text-xl text-on-surface-variant leading-relaxed max-w-xl relative z-10">{WEBSITE_CONTENT.home.visionText}</p> </div> <div className="glass-panel p-10 rounded-3xl flex flex-col justify-between hover:translate-y-[-10px] transition-transform duration-500"> <div className="space-y-6"> <div className="w-14 h-14 bg-tertiary/10 rounded-2xl flex items-center justify-center border border-tertiary/20"> <Icon name="rocket" className="w-7 h-7 text-tertiary" /> </div> <h3 className="text-2xl font-bold text-on-surface">{WEBSITE_CONTENT.home.missionTitle}</h3> <p className="text-on-surface-variant">{WEBSITE_CONTENT.home.missionText}</p> </div> <div className="mt-10 pt-8 border-t border-white/5"> <div className="flex items-center gap-3 text-tertiary font-bold cursor-pointer group"> <span>Lihat Selengkapnya</span> <Icon name="arrow-right" className="w-5 h-5 group-hover:translate-x-2 transition-transform" /> </div> </div> </div> </div> </section>
                    <section className="max-w-7xl mx-auto px-8 pb-24 relative z-10">
                        <div className="flex flex-col md:flex-row justify-between items-end mb-12 gap-6"> <div> <h2 className="text-4xl font-bold mb-4 text-on-surface">{WEBSITE_CONTENT.home.highlightTitle}</h2> <p className="text-on-surface-variant text-lg">{WEBSITE_CONTENT.home.highlightSubtitle}</p> </div> <button type="button" onClick={() => onNavigate('archive')} className="text-primary border-2 border-primary/30 font-bold px-8 py-3 rounded-full hover:bg-primary hover:text-white transition-all"> Arsip Lengkap </button> </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {ACTIVITIES.map((activity) => (
                                <LazyShow key={activity.id} minHeight="450px">
                                    <div onClick={() => setSelectedActivity(activity)} className="glass-panel rounded-3xl overflow-hidden group cursor-pointer hover:shadow-[0_15px_40px_rgba(125,211,252,0.15)] hover:translate-y-[-5px] transition-all duration-500">
                                        <div className="h-56 overflow-hidden relative"> <img src={getImageUrl(activity)} alt={activity.title} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" loading="lazy" referrerPolicy="no-referrer" /> <div className="absolute inset-0 bg-gradient-to-t from-background/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div> <div className="absolute top-4 left-4 glass-panel-elevated px-4 py-1.5 rounded-xl text-xs font-bold text-primary">{activity.date}</div> </div>
                                        <div className="p-8"> <div className="flex items-center justify-between mb-4 gap-3"> <h3 className="text-2xl font-bold text-on-surface group-hover:text-primary transition-colors">{activity.title}</h3> {activity.category && ( <span className="rounded-full bg-primary/10 px-3 py-1 text-xs uppercase tracking-wider text-primary font-bold"> {activity.category} </span> )} </div> <p className="text-on-surface-variant text-sm mb-6 line-clamp-2 leading-relaxed">{activity.description}</p> <div className="flex items-center justify-between pt-4 border-t border-white/5"> <div className="flex items-center gap-2 text-on-surface-variant text-sm"><Icon name="map-pin" className="w-4 h-4 text-primary" /><span>{activity.location}</span></div> <div className="flex items-center gap-4"> <button type="button" onClick={(e) => handleLike(activity.id, e)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold transition-all ${ hasUserLiked(activity.id) ? 'bg-red-500/20 text-red-400' : 'bg-black/5 dark:bg-white/5 text-on-surface-variant hover:bg-red-500/10 hover:text-red-400' }`} > <Icon name="heart" className={`w-4 h-4 ${hasUserLiked(activity.id) ? 'fill-current' : ''}`} /> <span>{getTotalLikes(activity.id) || activity.likes || 0}</span> </button> </div> </div> </div>
                                    </div>
                                </LazyShow>
                            ))}
                        </div>
                    </section>
                    <ActivityModal activity={selectedActivity} onClose={() => setSelectedActivity(null)} auth={auth} />
                </div>
            );
        };

        const ArchivePage = ({ auth }) => {
            const [selectedActivity, setSelectedActivity] = useState(null);
            const { handleLike, hasUserLiked, getTotalLikes } = useLikes();
            return (
                <div className="pt-32 pb-20 px-6 max-w-7xl mx-auto fade-in">
                    <header className="mb-16 text-center relative z-10"> <h1 className="text-5xl md:text-6xl font-extrabold text-on-surface tracking-tight mb-4"> {WEBSITE_CONTENT.archive.title.split(' ')[0]} <span className="text-primary">{WEBSITE_CONTENT.archive.title.split(' ')[1]}</span> </h1> <p className="text-on-surface-variant max-w-2xl mx-auto text-lg">{WEBSITE_CONTENT.archive.subtitle}</p> </header>
                    <section className="mb-24 relative z-10">
                        <div className="flex items-center gap-3 mb-10"> <Icon name="history" className="text-primary w-8 h-8" /> <h2 className="text-3xl font-bold tracking-tight text-on-surface">{WEBSITE_CONTENT.archive.recentTitle}</h2> </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {ACTIVITIES.map((activity) => (
                                <LazyShow key={activity.id} minHeight="400px">
                                    <div onClick={() => setSelectedActivity(activity)} className="glass-panel rounded-xl overflow-hidden group hover:shadow-[0_0_30px_rgba(125,211,252,0.1)] transition-all duration-500 cursor-pointer">
                                        <div className="h-56 w-full overflow-hidden relative"> <img src={getImageUrl(activity)} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy" referrerPolicy="no-referrer" /> <div className="absolute top-4 left-4 glass-panel-elevated px-3 py-1 rounded-full text-xs font-bold text-on-surface-variant tracking-widest uppercase">{activity.status}</div> </div>
                                        <div className="p-8"> <div className="flex items-center gap-2 text-primary text-sm font-medium mb-3"><Icon name="calendar" className="w-4 h-4" />{activity.date}</div> <h3 className="text-xl font-bold text-on-surface mb-3 group-hover:text-primary transition-colors">{activity.title}</h3> <p className="text-on-surface-variant text-sm leading-relaxed mb-6 line-clamp-3">{activity.description}</p> <div className="flex items-center justify-between gap-3"> <button type="button" onClick={(e) => handleLike(activity.id, e)} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${ hasUserLiked(activity.id) ? 'bg-red-500/20 text-red-400' : 'bg-black/5 dark:bg-white/5 text-on-surface-variant hover:bg-red-500/10 hover:text-red-400' }`} > <Icon name="heart" className={`w-4 h-4 ${hasUserLiked(activity.id) ? 'fill-current' : ''}`} /> <span>{getTotalLikes(activity.id) || activity.likes || 0}</span> </button> <div className="w-full py-3 rounded-lg border border-primary/30 text-primary font-semibold glass-panel-elevated group-hover:bg-primary/20 transition-all duration-300 flex items-center justify-center gap-2"> <Icon name="eye" className="w-4 h-4" />Lihat Detail </div> </div> </div>
                                    </div>
                                </LazyShow>
                            ))}
                        </div>
                    </section>
                    <section className="mb-24 relative z-10">
                        <div className="flex items-center gap-3 mb-10"> <Icon name="history" className="text-on-surface-variant w-8 h-8" /> <h2 className="text-3xl font-bold tracking-tight text-on-surface">{WEBSITE_CONTENT.archive.pastTitle}</h2> </div>
                        <div className="grid grid-cols-1 md:grid-cols-4 md:grid-rows-2 gap-6">
                            {PAST_COLLECTIONS.map((item, idx) => (
                                <LazyShow key={item.id} minHeight="300px">
                                    <div onClick={() => setSelectedActivity({ ...item, status: 'Arsip', location: 'N/A' })} className={`glass-panel rounded-xl overflow-hidden group relative min-h-[300px] cursor-pointer ${idx === 0 ? "md:col-span-2 md:row-span-2" : idx === 1 ? "md:col-span-2 md:row-span-1" : "md:col-span-1 md:row-span-1"}`}>
                                        <img src={getImageUrl(item)} className="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" loading="lazy" referrerPolicy="no-referrer" /> <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent"></div>
                                        <div className="absolute bottom-0 left-0 p-8 w-full"> <div className="text-primary text-xs font-bold mb-2 tracking-[0.2em] uppercase">{item.category}</div> <h3 className="text-2xl font-bold mb-3 text-white">{item.title}</h3> <p className="text-slate-200 text-sm opacity-0 group-hover:opacity-100 transition-opacity duration-500 mb-4">{item.description}</p> <button type="button" onClick={(e) => handleLike(item.id, e)} className={`flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-all ${ hasUserLiked(item.id) ? 'bg-red-500/20 text-red-400' : 'bg-white/10 text-white hover:bg-red-500/20 hover:text-red-400' }`} > <Icon name="heart" className={`w-4 h-4 ${hasUserLiked(item.id) ? 'fill-current' : ''}`} /> <span>{getTotalLikes(item.id) || item.likes || 0}</span> </button> </div>
                                    </div>
                                </LazyShow>
                            ))}
                        </div>
                    </section>
                    <ActivityModal activity={selectedActivity} onClose={() => setSelectedActivity(null)} auth={auth} />
                </div>
            );
        };

        const StructurePage = () => {
            const [activePeriod, setActivePeriod] = useState(AVAILABLE_PERIODS[0]);
            const filteredMembers = useMemo(() => MEMBERS.filter(m => m.period === activePeriod), [activePeriod]);
            const grouped = useMemo(() => {
                return { ketua: filteredMembers.find(m => m.role === 'Ketua'), wakil: filteredMembers.find(m => m.role === 'Wakil Ketua'), pemangkuAdat: filteredMembers.filter(m => m.role === 'Pemangku Adat 1' || m.role === 'Pemangku Adat 2' || m.role === 'Pemangku Adat 3' ), sekretariat: filteredMembers.filter(m => m.role === 'Kerana (CO)' || m.role === 'Kerani (Wakil)' || m.role === 'Kerana' || m.role === 'Kerani'), juang: filteredMembers.filter(m => m.role === 'Juang'|| m.role === 'Juang (CO)'|| m.role === 'Juang (Wakil)'), litev: filteredMembers.filter(m => m.role === 'Litev' || m.role === 'Litev (CO)' || m.role === 'Litev (Wakil)'), litbang: filteredMembers.filter(m => m.role === 'Litbang' || m.role === 'Litbang (CO)' || m.role === 'Litbang (Wakil)'), tekpram: filteredMembers.filter(m => m.role === 'Tekpram' || m.role === 'Tekpram (CO)' || m.role === 'Tekpram (Wakil)'), pemateri: filteredMembers.filter(m => m.role === 'Pemateri' || m.role === 'Pemateri (CO)' || m.role === 'Pemateri (Wakil)'), departemen: filteredMembers.filter(m => m.role === 'buangan') };
            }, [filteredMembers]);

            const MemberCard = ({ member, colorClass = "text-primary" }) => ( <div className="glass-panel p-6 rounded-2xl text-center hover:translate-y-[-8px] hover:shadow-[0_10px_30px_rgba(0,0,0,0.1)] transition-all duration-300 group"> <div className="overflow-hidden rounded-xl mb-4"> <img src={getImageUrl(member)} className="w-24 h-24 mx-auto object-cover border border-black/5 dark:border-white/10 group-hover:scale-110 transition-transform duration-500" loading="lazy" referrerPolicy="no-referrer" /> </div> <p className={`text-xs font-bold uppercase tracking-widest mb-1 ${colorClass}`}>{member.role}</p> <p className="text-lg font-semibold text-on-surface">{member.name}</p> </div> );
            
            const RoleSection = ({ title, members, colorClass }) => {
                if (members.length === 0) return null;
                return ( <div className="mb-24 relative z-10"> <h3 className="text-2xl font-bold text-on-surface mb-10 flex items-center gap-3"> <span className={`w-12 h-[2px] ${colorClass.replace('text-', 'bg-')}`}></span>{title} </h3> <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"> {members.map(member => <LazyShow key={member.id} minHeight="250px"><MemberCard member={member} colorClass={colorClass} /></LazyShow>)} </div> </div> );
            };

            return (
                <div className="pt-32 pb-20 px-6 max-w-7xl mx-auto fade-in">
                    <header className="text-center mb-16 relative z-10"> <h1 className="text-5xl md:text-6xl font-extrabold text-on-surface tracking-tight mb-6"> {WEBSITE_CONTENT.structure.title.split(' ')[0]} <span className="text-primary">{WEBSITE_CONTENT.structure.title.split(' ')[1]}</span> </h1> <p className="text-on-surface-variant max-w-2xl mx-auto text-lg">{WEBSITE_CONTENT.structure.subtitle}</p> </header>
                    <div className="flex flex-col items-center mb-20 relative z-10"> <div className="glass-panel p-1.5 rounded-full flex gap-1 inline-flex overflow-x-auto max-w-full"> {AVAILABLE_PERIODS.map((period) => ( <button key={period} onClick={() => setActivePeriod(period)} className={`px-8 py-3 rounded-full text-sm font-bold transition-all duration-300 whitespace-nowrap ${activePeriod === period ? "bg-primary/15 border border-primary/40 text-primary shadow-[0_0_20px_rgba(125,211,252,0.1)]" : "text-on-surface-variant hover:text-primary hover:bg-black/5 dark:hover:bg-white/5"}`}> Periode {period} </button> ))} </div> </div>
                    {filteredMembers.length === 0 ? (
                        <div className="glass-panel p-12 rounded-3xl text-center w-full relative z-10"> <Icon name="users" className="w-16 h-16 text-on-surface-variant mx-auto mb-4 opacity-20" /> <p className="text-on-surface-variant text-xl">{WEBSITE_CONTENT.structure.noData}</p> </div>
                    ) : (
                        <>
                            {grouped.ketua && (
                                <div className="mb-24 relative z-10"> <h3 className="text-2xl font-bold text-on-surface mb-10 flex items-center gap-3"><span className="w-12 h-[2px] bg-primary"></span>{WEBSITE_CONTENT.structure.categories.pimpinan}</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
                                        <LazyShow minHeight="300px">
                                            <div className="md:col-span-8 glass-panel rounded-3xl p-8 flex flex-col md:flex-row items-center gap-8 group hover:shadow-[0_0_30px_rgba(125,211,252,0.15)] transition-all duration-500"> <div className="overflow-hidden rounded-2xl"> <img src={getImageUrl(grouped.ketua)} className="w-48 h-48 md:w-64 md:h-64 object-cover border-2 border-primary/20 group-hover:scale-110 transition-transform duration-700" loading="lazy" referrerPolicy="no-referrer" /> </div> <div className="text-center md:text-left flex-1"> <span className="inline-block px-4 py-1 rounded-full bg-primary/10 text-primary text-sm font-semibold mb-4 tracking-widest uppercase">Ketua</span> <h2 className="text-4xl font-bold text-on-surface mb-3 tracking-tight">{grouped.ketua.name}</h2> <p className="text-on-surface-variant text-lg leading-relaxed mb-6 italic">"{grouped.ketua.quote || 'Membangun masa depan bersama.'}"</p> <div className="flex justify-center md:justify-start gap-4"> <Icon name="link" className="text-primary cursor-pointer hover:scale-125 transition-transform" /> <Icon name="mail" className="text-primary cursor-pointer hover:scale-125 transition-transform" /> </div> </div> </div>
                                        </LazyShow>
                                        {grouped.wakil && ( <LazyShow minHeight="300px"><div className="md:col-span-4 glass-panel rounded-3xl p-8 flex flex-col items-center justify-center text-center group hover:shadow-[0_0_30px_rgba(168,85,247,0.15)] transition-all duration-500"> <div className="overflow-hidden rounded-full mb-6"> <img src={getImageUrl(grouped.wakil)} className="w-40 h-40 object-cover border-2 border-purple-500/20 group-hover:scale-110 transition-transform duration-700" loading="lazy" referrerPolicy="no-referrer" /> </div> <span className="px-3 py-1 rounded-full bg-purple-500/10 text-tertiary text-xs font-bold mb-3 tracking-widest uppercase">Wakil Ketua</span> <h3 className="text-2xl font-bold text-on-surface">{grouped.wakil.name}</h3> <p className="text-on-surface-variant text-lg leading-relaxed mb-6 italic">"{grouped.wakil.quote || 'Membangun masa depan bersama.'}"</p> </div></LazyShow> )}
                                    </div>
                                </div>
                            )}
                            <RoleSection title={WEBSITE_CONTENT.structure.categories.pemangkuAdat} members={grouped.pemangkuAdat} colorClass="text-primary" />
                            <RoleSection title={WEBSITE_CONTENT.structure.categories.sekretariat} members={grouped.sekretariat} colorClass="text-primary" />
                            <RoleSection title={WEBSITE_CONTENT.structure.categories.juang} members={grouped.juang} colorClass="text-tertiary" />
                            <RoleSection title={WEBSITE_CONTENT.structure.categories.litev} members={grouped.litev} colorClass="text-primary" />
                            <RoleSection title={WEBSITE_CONTENT.structure.categories.litbang} members={grouped.litbang} colorClass="text-primary" />
                            <RoleSection title={WEBSITE_CONTENT.structure.categories.tekpram} members={grouped.tekpram} colorClass="text-primary" />
                            <RoleSection title={WEBSITE_CONTENT.structure.categories.pemateri} members={grouped.pemateri} colorClass="text-primary" />
                            {grouped.departemen.length > 0 && ( <div className="mb-24 relative z-10"> <h3 className="text-2xl font-bold text-on-surface mb-10 flex items-center gap-3"><span className="w-12 h-[2px] bg-primary"></span>{WEBSITE_CONTENT.structure.categories.departemen}</h3> <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"> {grouped.departemen.map(member => <LazyShow key={member.id} minHeight="250px"><MemberCard member={member} colorClass={member.role.includes('Bakat') ? "text-tertiary" : "text-primary"} /></LazyShow>)} </div> </div> )}
                        </>
                    )}
                </div>
            );
        };

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [isLightMode, setIsLightMode] = useState(() => localStorage.getItem('paskanessTheme') === 'light');
            const [showAuthModal, setShowAuthModal] = useState(false);
            
            const auth = useAuth();

            useEffect(() => {
                const listener = () => setShowAuthModal(true);
                window.addEventListener('openAuthModal', listener);
                return () => window.removeEventListener('openAuthModal', listener);
            }, []);

            useEffect(() => {
                if (isLightMode) { document.documentElement.classList.add('light-mode'); localStorage.setItem('paskanessTheme', 'light'); } 
                else { document.documentElement.classList.remove('light-mode'); localStorage.setItem('paskanessTheme', 'dark'); }
            }, [isLightMode]);

            const toggleTheme = () => setIsLightMode(!isLightMode);
            useEffect(() => { document.title = `${WEBSITE_CONFIG.brandName} - Jejak Karya & Arsip`; }, []);
            useEffect(() => { window.scrollTo(0, 0); if (window.lucide) window.lucide.createIcons(); }, [activeTab]);

            return (
                <div className="min-h-screen flex flex-col relative z-0">
                    <Background3DObjects />
                    
                    <Navbar activeTab={activeTab} setActiveTab={setActiveTab} isLightMode={isLightMode} toggleTheme={toggleTheme} auth={auth} />
                    
                    <main className="flex-grow">
                        {activeTab === 'home' && <HomePage onNavigate={setActiveTab} auth={auth} />}
                        {activeTab === 'archive' && <ArchivePage auth={auth} />}
                        {activeTab === 'structure' && <StructurePage />}
                    </main>
                    <Footer />

                    {showAuthModal && <AuthProfileModal auth={auth} onClose={() => setShowAuthModal(false)} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
